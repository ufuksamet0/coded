name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version okunur: package.json -> packageManager (pnpm 11.20.0)

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -r lint
        # NOT (Faz-2 Adim 2): repo'da eslint config yok + core/cli'de lint scripti yok -> kirmizi beklenir.

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (core, coverage)
        run: pnpm --filter @coded/core test -- --coverage
        # NOT (Faz-2 Adim 5): @vitest/coverage-v8 + vitest.config.ts + esikler henuz yok -> provider eksikse kirmizi beklenir.

      - name: Build
        run: pnpm -r build
